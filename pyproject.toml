[project]
name = "ref-neus-local"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "trimesh==3.16.4",
    "pyhocon==0.3.60",
    "opencv-python-headless==4.9.0.80",
    "tqdm==4.66.5",
    "open3d==0.19.0",
    "imageio==2.34.2",
    "PyMCubes==0.1.6",
    "tensorboard==2.16.2",
    "chardet==5.2.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
